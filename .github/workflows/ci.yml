name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch: sem fila de builds
# obsoletos consumindo minutos à toa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  qualidade:
    name: Tipos, lint, formato e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Os quatro passos são independentes e rodam sempre, mesmo após falha:
      # ver todos os problemas de uma vez vale mais do que parar no primeiro.
      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint (inclui fronteiras entre camadas)
        if: '!cancelled()'
        run: npm run lint

      - name: Verificar formatação
        if: '!cancelled()'
        run: npm run format:check

      - name: Testes unitários
        if: '!cancelled()'
        run: npm run test

  banco:
    name: Migrations e garantias do banco
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres EFÊMERO, criado e destruído a cada execução.
    #
    # Rodar migration de CI contra o Railway seria `push --force` em produção:
    # funciona até o dia em que não funciona. Aqui a migration é exercitada em
    # banco vazio a cada commit, e o banco real só é tocado no deploy.
    #
    # A versão 18 não é detalhe: `uuidv7()` é nativo dela, e o schema depende
    # disso. Um Postgres 16 passaria em quase tudo e quebraria na criação.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rohair
          POSTGRES_PASSWORD: rohair
          POSTGRES_DB: rohair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rohair"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rohair:rohair@localhost:5432/rohair_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Gerar o cliente Prisma
        run: npx prisma generate

      # `migrate deploy` aplica as migrations como em produção, sem inventar
      # nada — é o mesmo comando que rodará no deploy real.
      - name: Aplicar migrations em banco vazio
        run: npx prisma migrate deploy

      # Aplicar duas vezes precisa ser inofensivo. Se não for, o deploy que
      # reexecutar por qualquer motivo derruba produção.
      - name: Reaplicar — migration precisa ser idempotente
        run: npx prisma migrate deploy

      # Prova que o banco garante o que a aplicação promete: exclusão de
      # sobreposição, índice parcial de CPF, um cronômetro aberto por vez.
      - name: Garantias que só o banco pode dar
        run: npx vitest run --project db

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Compilar
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://rohair.vercel.app
          APP_ENV: preview

  e2e:
    name: Testes ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # WebKit é obrigatório, não opcional: o projeto "iphone" do Playwright usa
      # o motor do Safari. Sem ele, a plataforma principal do produto ficaria
      # justamente fora da suíte que deveria protegê-la.
      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Executar suíte E2E
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          APP_ENV: local

      - name: Publicar relatório
        uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
